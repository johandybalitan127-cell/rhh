<!DOCTYPE html>
<html class="h-full bg-[#F8F7FC]" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>TecnoCR Soluciones - Portal &amp; Chatbot RRHH</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Google Fonts: Plus Jakarta Sans & Playfair Display -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>

              50: '#FAF8FD',

              400: '#BA9FDF',
              500: '#9E7CD0',

              800: '#543685',
              900: '#3D2562',
              950: '#251540',

            lavender: {

              300: '#C4B5FD',
              400: '#A78BFA',

  <style data-purpose="custom-scrollbars-and-glow">
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(230, 222, 239, 0.8);
    }
    .glow-lilac {
      box-shadow: 0 0 28px -4px rgba(186, 159, 223, 0.45);
    }

<body class="min-h-screen w-full text-slate-800 antialiased font-sans bg-[#F8F7FC] m-0 p-0">

  <div id="root" class="min-h-screen w-full flex flex-col"></div>

  <!-- Carga del bundle de React vía Vite -->
  <script type="module" src="/src/main.jsx"></script>
